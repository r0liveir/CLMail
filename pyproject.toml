[project]
name = "CLMail"
version = "0.1.0"
description = "Simple AI Engineering example tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "ruff>=0.16.7",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
clmail = "clmail.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
