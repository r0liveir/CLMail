[project]
name = "CLMail"
version = "0.1.0"
description = "Simple AI Engineering example tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai[groq]>=2.42.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
clmail = "clmail.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
