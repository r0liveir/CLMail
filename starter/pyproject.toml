[project]
name = "clmail-starter"
version = "0.1.0"
description = "Starter project for the CLMail lesson"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.11.0",
    "pydantic-ai[groq]>=2.42.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
clmail = "clmail.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
